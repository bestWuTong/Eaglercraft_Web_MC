<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的世界 网页版 | Minecraft Web Edition</title>
  <style>
    @font-face {
      font-family: 'MinecraftFont';
      src: url('https://fonts.gstatic.com/s/pressstart2p/v15/e3t4euO8T-267oIAQAu6jDQyK3nVivM.woff2') format('woff2');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a1a;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 31px,
          rgba(0,0,0,0.15) 31px,
          rgba(0,0,0,0.15) 32px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 31px,
          rgba(0,0,0,0.15) 31px,
          rgba(0,0,0,0.15) 32px
        );
      background-color: #5b7a38;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'MinecraftFont', 'Courier New', monospace;
      color: #fff;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding: 40px 20px;
    }

    .title-wrapper {
      text-align: center;
    }

    .title {
      font-family: 'MinecraftFont', 'Courier New', monospace;
      font-size: clamp(28px, 6vw, 56px);
      color: #fff;
      text-shadow:
        4px 4px 0 #3f3f3f,
        -2px -2px 0 #3f3f3f,
        2px -2px 0 #3f3f3f,
        -2px 2px 0 #3f3f3f;
      letter-spacing: 2px;
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .title-en {
      font-family: 'MinecraftFont', 'Courier New', monospace;
      font-size: clamp(12px, 2vw, 20px);
      color: #d4d4d4;
      text-shadow: 2px 2px 0 #3f3f3f;
      letter-spacing: 2px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }

    .mc-btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      font-family: 'MinecraftFont', 'Courier New', monospace;
      font-size: clamp(14px, 2.5vw, 20px);
      text-align: center;
      text-decoration: none;
      color: #fff;
      background-color: #5a7e2d;
      border: none;
      cursor: pointer;
      position: relative;
      outline: none;
      /* Minecraft button style */
      box-shadow:
        inset -3px -4px 0 #2d4a0e,
        inset 3px 3px 0 #8ab83a,
        0 4px 0 #1a2d00;
      transition: filter 0.05s;
      text-shadow: 2px 2px 0 #1e3a00;
      letter-spacing: 1px;
    }

    .mc-btn:hover {
      background-color: #6fa33a;
      box-shadow:
        inset -3px -4px 0 #3a6018,
        inset 3px 3px 0 #9fcc55,
        0 4px 0 #1a2d00;
      filter: brightness(1.08);
    }

    .mc-btn:active {
      background-color: #4a6a22;
      box-shadow:
        inset 3px 4px 0 #2d4a0e,
        inset -3px -3px 0 #8ab83a,
        0 2px 0 #1a2d00;
      transform: translateY(2px);
    }

    .btn-zh {
      display: block;
      font-size: clamp(16px, 3vw, 24px);
    }

    .btn-en {
      display: block;
      font-size: clamp(9px, 1.4vw, 13px);
      color: #c8e89a;
      margin-top: 4px;
      text-shadow: 1px 1px 0 #1e3a00;
    }

    .footer {
      font-size: 10px;
      color: #b0c880;
      text-shadow: 1px 1px 0 #2a3a10;
      text-align: center;
      line-height: 1.8;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title-wrapper">
      <div class="title">我的世界 网页版</div>
      <div class="title-en">Minecraft Web Edition</div>
    </div>

    <div class="buttons">
      <a href="mc.html" class="mc-btn">
        <span class="btn-zh">进入游戏</span>
        <span class="btn-en">Play in Browser</span>
      </a>
      <a href="mc.zip" download="mc.zip" class="mc-btn">
        <span class="btn-zh">下载离线版</span>
        <span class="btn-en">Download Offline Version</span>
      </a>
    </div>

    <div class="footer">
      Powered by EaglercraftX<br />
      本站并非Minecraft官方网站，与Mojang和微软亦无从属关系。<br />
      Not an official Minecraft website. We are not associated with Mojang or Microsoft.
    </div>
    <a href="https://www.bestwutong.top/" style="position: absolute; bottom: 10px; right: 10px; font-size: 15px; color: #cacaca; text-shadow: 1px 1px 0 #2a3a10;">回到無同的小屋</a>
  </div>
</body>
</html>
